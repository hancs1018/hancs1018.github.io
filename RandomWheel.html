<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机转盘 · 会产生的窝</title>
<style>
:root{color-scheme:light;--ink:#263d36;--muted:#667b72;--paper:#f6f5ef;--line:#dce3db;--green:#256047}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid #ad7137;outline-offset:4px}a{color:inherit}header{max-width:1160px;margin:auto;padding:28px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}header a{text-decoration:none;font-size:14px}header strong{font-size:16px;letter-spacing:2px}.brand-mark{display:inline-block;width:14px;height:14px;border:4px solid var(--green);border-radius:50%;margin-right:10px}main{max-width:1160px;margin:auto;padding:48px 24px}.intro small{color:var(--green);font-weight:700;letter-spacing:3px}.intro h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1px;margin:12px 0}.intro p{color:var(--muted);line-height:1.8;margin:0}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:56px;margin-top:40px;align-items:start}.stage{text-align:center;padding:20px 0}.wheel-wrap{position:relative;width:min(100%,460px);margin:auto;aspect-ratio:1}.wheel-wrap:before{content:"";position:absolute;inset:-10px;border:1px solid #cbd5c7;border-radius:50%}.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:26px;height:39px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%);z-index:2}canvas{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 16px 32px #263d3615}.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:68px;display:grid;place-items:center;border-radius:50%;background:var(--paper);border:6px solid white;box-shadow:0 3px 12px #263d3625;font-size:13px;font-weight:700;letter-spacing:2px}.primary{border:0;background:var(--green);color:white;border-radius:12px;padding:16px 32px;font-weight:700;transition:background .2s}.primary:hover:not(:disabled){background:#194b35}#spin{display:block;width:min(100%,340px);margin:32px auto 0;font-size:18px}.result{min-height:90px;margin:22px auto 0;max-width:440px}.result small{color:var(--muted)}.result strong{display:block;font-size:26px;margin-top:6px;overflow-wrap:anywhere}.editor{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}.editor-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.editor h2{font-size:21px;margin:0}.count{font-size:12px;border-radius:20px;background:#edf3ed;color:var(--green);padding:6px 10px}.help{font-size:13px;color:var(--muted);line-height:1.8;margin:14px 0 24px}.columns,.option{display:grid;grid-template-columns:12px minmax(0,1fr) 76px 58px 30px;gap:8px;align-items:center}.columns{font-size:11px;color:var(--muted);margin-bottom:10px}.option{margin-bottom:12px}.dot{width:10px;height:10px;border-radius:50%}input{width:100%;min-width:0;padding:11px 8px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fafbf8;font-size:14px}input:focus{outline:2px solid var(--green);outline-offset:1px}input[aria-invalid=true]{border-color:#b34334;background:#fff6f3}.chance{font-size:12px;font-variant-numeric:tabular-nums;text-align:right}.remove{border:0;background:none;font-size:22px;color:#7b8880;width:30px;height:38px;border-radius:6px}.remove:hover{background:#f6eeeb;color:#a33b2c}.secondary{border:1px solid var(--line);border-radius:9px;color:var(--green);background:white;padding:11px 16px;font-size:13px;font-weight:600}.secondary:hover:not(:disabled){background:#f0f5ee}#add{width:100%;border-style:dashed;margin:4px 0 20px}.editor-footer{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:20px;border-top:1px solid var(--line)}#total{font-size:12px;color:var(--muted)}#message{font-size:13px;color:#a33b2c;line-height:1.7;margin:12px 0 0;min-height:22px}.note{font-size:12px;color:var(--muted);line-height:1.8;margin:16px 4px}footer{max-width:1112px;margin:16px auto 0;padding:24px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}@media(max-width:800px){main{padding-top:28px}.layout{grid-template-columns:1fr;gap:24px;margin-top:24px}.stage{padding:20px 12px 0}.wheel-wrap{max-width:380px}.editor{padding:22px}footer{margin:20px 24px;gap:16px}header{padding:20px 24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><strong><span class="brand-mark" aria-hidden="true"></span>随机转盘</strong><a href="index.html">← 返回小窝</a></header>
<main>
<section class="intro"><small>把选择交给一点随机</small><h1>下一次，会转到什么？</h1><p>写下你的选项，设定各自的概率。剩下的，让转盘来决定。</p></section>
<div class="layout">
<section class="stage" aria-label="抽取区域">
<div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="1000" height="1000" role="img" aria-label="随机转盘，扇区大小对应各选项概率"></canvas><div class="hub" aria-hidden="true">好运</div></div>
<button class="primary" id="spin">转一下，做个决定</button>
<label style="display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:var(--muted);cursor:pointer"><input id="animate-wheel" type="checkbox" checked style="width:16px;height:16px;accent-color:var(--green)">播放转动动画（关闭后直接显示结果）</label>
<div style="margin-top:12px"><label for="spin-seconds" style="font-size:13px;color:var(--muted)">转动时长（秒）</label> <input id="spin-seconds" type="number" min="0.5" max="120" step="any" value="5.2" required style="width:90px" aria-describedby="duration-help"><p id="duration-help" style="font-size:12px;color:var(--muted);margin:8px 0">可输入 0.5～120 秒，支持小数。</p></div>
<div class="result" role="status" aria-live="polite"><small id="result-label">每一次转动，都是新的可能</small><strong id="result-name">准备好了吗？</strong></div>
</section>
<section>
<div class="editor"><div class="editor-heading"><h2>我的选项</h2><span class="count" id="count"></span></div>
<p class="help">设置相对权重，系统自动换算概率，无需凑满 100。<br>例如填 1、2、1，概率就是 25%、50%、25%。填 0 则不会抽中。</p>
<div class="columns" aria-hidden="true"><span></span><span>选项名称</span><span>概率权重</span><span style="text-align:right">实际概率</span><span></span></div>
<div id="options"></div><button class="secondary" id="add">＋ 添加一个选项</button>
<div class="editor-footer"><span id="total"></span><button class="secondary" id="equal">设为等概率</button></div>
<p id="message" role="status" aria-live="polite"></p></div>
<p class="note" id="save-note">选项自动保存在当前浏览器，下次打开可以继续使用。<br>转盘的扇区大小与实际概率一致，抽取期间无法修改选项。</p>
</section>
</div>
</main>
<footer><span>会产生的窝 / 随机小工具</span><span>不必纠结，转一下就好。</span></footer>
<script>
'use strict';
const colors = ['#e8ba68','#8bb9a0','#e69880','#96b4ce','#bea5c8','#c5ca7d','#dbad93','#90c6c3'];
const defaults = [{name:'火锅',weight:3},{name:'面条',weight:2},{name:'米饭',weight:2},{name:'烧烤',weight:1},{name:'饺子',weight:1},{name:'再想想',weight:1}];
const storageKey = 'hcs-random-wheel-v1';
let options = defaults.map(item => ({...item}));
try {
 const saved = JSON.parse(localStorage.getItem(storageKey));
 if (Array.isArray(saved) && saved.length > 0 && saved.every(item => item && typeof item.name === 'string' && typeof item.weight === 'number' && Number.isFinite(item.weight) && item.weight >= 0)) options = saved;
} catch (_) {}
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const list = document.getElementById('options');
const spinButton = document.getElementById('spin');
const message = document.getElementById('message');
let spinning = false;
let rotation = 0;
function totalWeight() { return options.reduce((sum,item) => sum + item.weight,0); }
function probabilityText(value) {
 if (value > 0 && value < .01) return '<0.01%';
 return Number(value.toFixed(2)) + '%';
}
function save() {
 try { localStorage.setItem(storageKey,JSON.stringify(options)); }
 catch (_) { document.getElementById('save-note').textContent = '浏览器无法保存设置，本次仍可正常使用转盘。'; }
}
function validate() {
 const total = totalWeight();
 if (!options.length) return '先添加一个选项，再开始转动。';
 if (options.some(item => !item.name.trim())) return '请为每个选项填写名称。';
 if (options.some(item => !Number.isFinite(item.weight) || item.weight < 0)) return '概率权重必须是大于或等于 0 的有效数字。';
 if (!Number.isFinite(total)) return '权重总和过大，请调小数值。';
 if (total <= 0) return '至少需要一个选项的权重大于 0。';
 return '';
}
function refresh() {
 const total = totalWeight();
 const error = validate();
 message.textContent = error;
 spinButton.disabled = spinning || !!error;
 document.getElementById('count').textContent = options.length + ' 个选项';
 document.getElementById('total').textContent = '有效选项 ' + options.filter(item => item.weight > 0).length + ' 个';
 list.querySelectorAll('.option').forEach((row,index) => {
  const item = options[index];
  row.querySelector('.chance').textContent = Number.isFinite(total) && total > 0 && Number.isFinite(item.weight) && item.weight >= 0 ? probabilityText(item.weight / total * 100) : '—';
  row.querySelector('[data-field="name"]').setAttribute('aria-invalid',!item.name.trim());
  row.querySelector('[data-field="weight"]').setAttribute('aria-invalid',!Number.isFinite(item.weight) || item.weight < 0);
 });
 draw();
}
function render() {
 list.replaceChildren();
 options.forEach((item,index) => {
  const row = document.createElement('div'); row.className = 'option';
  const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = colors[index % colors.length];
  const name = document.createElement('input'); name.value = item.name; name.dataset.field = 'name'; name.placeholder = '填写选项'; name.maxLength = 80; name.setAttribute('aria-label','选项 ' + (index+1) + ' 名称');
  const weight = document.createElement('input'); weight.type = 'number'; weight.min = '0'; weight.step = 'any'; weight.value = Number.isFinite(item.weight) ? item.weight : ''; weight.dataset.field = 'weight'; weight.setAttribute('aria-label','选项 ' + (index+1) + ' 概率权重');
  const chance = document.createElement('span'); chance.className = 'chance';
  const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'remove'; remove.textContent = '×'; remove.setAttribute('aria-label','删除选项 ' + (index+1));
  name.addEventListener('input',() => { item.name = name.value; changed(); });
  weight.addEventListener('input',() => { item.weight = weight.value === '' ? NaN : weight.valueAsNumber; changed(); });
  remove.addEventListener('click',() => { if(spinning) return; options.splice(index,1); render(); changed(); const target = list.querySelectorAll('.remove')[Math.min(index,options.length-1)]; (target || document.getElementById('add')).focus(); });
  row.append(dot,name,weight,chance,remove); list.append(row);
 });
 refresh();
}
function changed() {
 document.getElementById('result-label').textContent = '选项已更新，开始新的选择';
 document.getElementById('result-name').textContent = '准备好了吗？';
 rotation = 0;
 refresh();
 if (options.every(item => Number.isFinite(item.weight) && item.weight >= 0)) save();
}
function draw() {
 const size = 1000, center = size/2, radius = 488;
 ctx.clearRect(0,0,size,size);
 ctx.save(); ctx.translate(center,center); ctx.rotate(rotation * Math.PI/180);
 const total = totalWeight();
 const valid = Number.isFinite(total) && total > 0 && options.every(item => Number.isFinite(item.weight) && item.weight >= 0);
 if (!valid) { ctx.beginPath(); ctx.arc(0,0,radius,0,Math.PI*2); ctx.fillStyle = '#dce3db'; ctx.fill(); }
 else {
  let start = -Math.PI/2;
  options.forEach((item,index) => {
   if (item.weight === 0) return;
   const angle = item.weight/total*Math.PI*2, end = start + angle;
   ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,radius,start,end); ctx.closePath(); ctx.fillStyle = colors[index % colors.length]; ctx.fill();
   ctx.strokeStyle = '#f6f5ef'; ctx.lineWidth = 3; ctx.stroke();
   if (angle > .065) {
    ctx.save(); ctx.rotate(start + angle/2); ctx.translate(radius*.64,0);
    if (Math.cos(start+angle/2) < 0) ctx.rotate(Math.PI);
    ctx.fillStyle = '#263d36'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fontSize = Math.min(30,Math.max(16,angle*radius*.38)); ctx.font = '600 ' + fontSize + 'px system-ui, sans-serif';
    const chars = Array.from(item.name.trim() || '未命名'); let text = chars.join('');
    while (ctx.measureText(text).width > radius*.46 && chars.length > 1) { chars.pop(); text = chars.join('') + '…'; }
    ctx.fillText(text,0,0); ctx.restore();
   }
   start = end;
  });
 }
 ctx.beginPath(); ctx.arc(0,0,radius,0,Math.PI*2); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 16; ctx.stroke(); ctx.restore();
}
function randomUnit() { const data = new Uint32Array(1); crypto.getRandomValues(data); return data[0]/4294967296; }
function lock(value) {
 spinning = value;
 document.querySelectorAll('.editor button,.editor input,#spin-seconds,#animate-wheel').forEach(control => control.disabled = value);
 spinButton.disabled = value || !!validate();
 spinButton.textContent = value ? '转动中，等待好运…' : '再转一次';
}
spinButton.addEventListener('click',() => {
 if (spinning || validate()) return;
 const secondsInput = document.getElementById('spin-seconds');
 const animated = document.getElementById('animate-wheel').checked;
 if (animated && !secondsInput.reportValidity()) return;
 const duration = animated ? secondsInput.valueAsNumber * 1000 : 0;
 const total = totalWeight();
 const ticket = randomUnit()*total;
 let cumulative = 0, selected = options.findLastIndex(item => item.weight > 0), start = 0;
 for (let i=0;i<options.length;i++) {
  if (options[i].weight <= 0) continue;
  start = cumulative;
  cumulative += options[i].weight;
  if (ticket < cumulative) { selected = i; break; }
 }
 const chosen = options[selected];
 const landing = (start + chosen.weight*(.15 + randomUnit()*.7))/total*360;
 const from = rotation;
 const targetAngle = (360-landing)%360;
 const target = from + 360*6 + ((targetAngle-from%360+360)%360);
 lock(true);
 document.getElementById('result-label').textContent = '正在抽取';
 document.getElementById('result-name').textContent = '让好运转一会儿';
 const began = performance.now();
 function frame(now) {
  const progress = duration ? Math.min((now-began)/duration,1) : 1;
  // 对速度分段积分，使加速、匀速和减速之间保持连续。
  const accelerationEnd = .15, cruiseEnd = .35;
  const distance = accelerationEnd/2 + (cruiseEnd-accelerationEnd) + (1-cruiseEnd)/3;
  let traveled;
  if (progress < accelerationEnd) {
   traveled = progress*progress/(2*accelerationEnd);
  } else if (progress < cruiseEnd) {
   traveled = accelerationEnd/2 + progress-accelerationEnd;
  } else {
   const slowing = (progress-cruiseEnd)/(1-cruiseEnd);
   traveled = accelerationEnd/2 + cruiseEnd-accelerationEnd + (1-cruiseEnd)*(1-Math.pow(1-slowing,3))/3;
  }
  rotation = from + (target-from)*Math.min(traveled/distance,1); draw();
  if (progress < 1) requestAnimationFrame(frame);
  else {
   rotation = target%360; draw(); lock(false);
   document.getElementById('result-label').textContent = '本次选中 · 概率 ' + probabilityText(chosen.weight/total*100);
   document.getElementById('result-name').textContent = chosen.name;
  }
 }
 requestAnimationFrame(frame);
});
document.getElementById('add').addEventListener('click',() => {
 if (spinning) return;
 options.push({name:'新选项',weight:1}); render(); changed();
 const input = list.lastElementChild.querySelector('input'); input.focus(); input.select();
});
document.getElementById('equal').addEventListener('click',() => {
 if (spinning) return;
 options.forEach(item => item.weight = 1); render(); changed();
});
render();
</script>
</body>
</html>
