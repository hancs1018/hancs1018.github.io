<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 背景光斑 -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <main class="card">
        <!-- 文字头像：修改 initials 内容为你名字的首字母或汉字 -->
        <div class="avatar">
            <span class="avatar-initials">H</span>
        </div>

        <!-- 名字与身份 -->
        <h1 class="name">会产生</h1>
        <p class="title">软件工程师 / 自由职业者</p>

        <!-- 一句话介绍 -->
        <p class="bio">用代码构建想法，用设计表达态度。正在寻找有趣的合作机会。</p>

        <!-- 游戏目录 -->
        <section class="games">
            <h2 class="games-title">游戏目录</h2>
            <div class="games-grid">
                <a class="game-card" href="Chronicle-Sealed/index.html">
                    <div class="game-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <div class="game-info">
                        <span class="game-name">编年史封印</span>
                        <span class="game-desc">策略文字冒险</span>
                    </div>
                </a>
                <a class="game-card" href="Midnight-Lease/index.html">
                    <div class="game-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
                    </div>
                    <div class="game-info">
                        <span class="game-name">午夜租约</span>
                        <span class="game-desc">密室逃脱 · 规则怪谈</span>
                    </div>
                </a>
                <!-- 在此处添加更多游戏卡片 -->
            </div>
        </section>

        <!-- 联系方式 -->
        <div class="contact">
            <a class="contact-item" href="mailto:hello@example.com" title="发送邮件">
                <span class="contact-label">邮箱</span>
                <span class="contact-value">hello@example.com</span>
            </a>
            <a class="contact-item" href="tel:+8613800000000" title="拨打电话">
                <span class="contact-label">电话</span>
                <span class="contact-value">+86 138 0000 0000</span>
            </a>
        </div>

        <!-- 社交链接 -->
        <nav class="social">
            <a href="https://github.com/yourname" target="_blank" rel="noopener" class="social-link" aria-label="GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.74.8 1.18 1.83 1.18 3.09 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
                GitHub
            </a>
            <a href="https://x.com/yourname" target="_blank" rel="noopener" class="social-link" aria-label="X / Twitter">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.47l8.6-9.83L0 1.15h7.6l5.24 6.93 6.06-6.93zm-1.29 19.5h2.04L6.49 3.24H4.3l13.3 17.41z"/></svg>
                X
            </a>
            <a href="https://www.linkedin.com/in/yourname" target="_blank" rel="noopener" class="social-link" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
                LinkedIn
            </a>
            <a href="https://t.me/yourname" target="_blank" rel="noopener" class="social-link" aria-label="Telegram">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.94 0C5.34 0 0 5.34 0 11.94c0 6.6 5.34 11.94 11.94 11.94 6.6 0 11.94-5.34 11.94-11.94C23.88 5.34 18.54 0 11.94 0zm5.87 8.12l-2 9.42c-.15.66-.54.82-1.1.51l-3.04-2.24-1.47 1.41c-.16.16-.3.3-.61.3l.22-3.1 5.64-5.1c.25-.22-.05-.34-.38-.12l-6.97 4.39-3-0.94c-.65-.2-.66-.65.14-.96l11.73-4.52c.54-.2 1.02.13.84.95z"/></svg>
                Telegram
            </a>
        </nav>

        <footer class="footer">© 2026 你的名字 · 保持热爱，奔赴山海</footer>
    </main>

    <script src="/js/script.js"></script>
</body>
</html>
