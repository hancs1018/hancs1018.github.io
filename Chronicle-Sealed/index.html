<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封存纪年 · 文字解谜</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>封 存 纪 年</h1>
    <p class="sub">—— 旧档余烬 · 文字密室 ——</p>
    <div class="bar">
      <span id="loc">入口大厅</span>
      <span id="hintInfo">提示次数：3</span>
      <button id="btnHint">查看提示</button>
      <button id="btnReset">重新开始</button>
    </div>
  </header>

  <main id="story"></main>

  <section id="side">
    <h3>背包</h3>
    <ul id="bag"><li class="empty">空空如也</li></ul>
    <h3>已获线索</h3>
    <ul id="clues"><li class="empty">暂无线索</li></ul>
  </section>
</div>
<script src="game.js"></script>

</html>
